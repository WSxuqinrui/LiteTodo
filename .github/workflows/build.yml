name: LiteTodo build and size gate
on:
  workflow_dispatch:
  push:
    paths: ['src/**', 'assets/**', 'tests/**', 'scripts/**', 'CMakeLists.txt', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            binary: build/LiteTodo
            arch: ''
          - os: macos-14
            platform: macos-arm64
            binary: build/LiteTodo.app
            arch: arm64
          - os: macos-15-intel
            platform: macos-x64
            binary: build/LiteTodo.app
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxext-dev libxinerama-dev libxfixes-dev libxft-dev libxcursor-dev libxrender-dev libpango1.0-dev libdbus-1-dev
      - name: macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja
      - run: python scripts/fetch-deps.py
      - name: Configure
        shell: bash
        run: |
          args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=(-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0)
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel "${args[@]}"
      - run: cmake --build build --target LiteTodo store_tests --parallel 4
      - run: ctest --test-dir build --output-on-failure
      - run: python tests/package_tests.py
      - name: Linux dependency evidence
        if: runner.os == 'Linux'
        run: ldd build/LiteTodo
      - run: python scripts/package.py --binary '${{ matrix.binary }}' --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@v4
        with:
          name: LiteTodo-${{ matrix.platform }}
          path: dist/*.zip

# 首次上传后会触发构建；运行结果以 GitHub Actions 状态为准。
